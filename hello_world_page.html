<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Modern Interactive Experience</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .text-gradient {
            background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glow-effect {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        .glow-effect:hover {
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.6);
        }

        /* Floating background elements */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between relative overflow-x-hidden">

    <!-- Background Animated Orbs -->
    <div class="orb bg-purple-600 w-72 h-72 top-10 left-10"></div>
    <div class="orb bg-pink-600 w-96 h-96 bottom-10 right-10" style="animation-delay: -5s;"></div>
    <div class="orb bg-blue-600 w-80 h-80 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="animation-delay: -2.5s;"></div>

    <!-- Header Section -->
    <header class="relative z-10 w-full max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-purple-500/20 rounded-xl border border-purple-500/30">
                <i class="fa-solid fa-code text-purple-400 text-xl"></i>
            </div>
            <span class="font-bold text-lg tracking-wider text-slate-200">HELLO.WORLD</span>
        </div>
        
        <div class="flex items-center space-x-4">
            <button id="themeToggle" class="px-4 py-2 text-sm glass-card rounded-xl hover:bg-white/10 transition-all flex items-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i>
                <span>變換主題</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="relative z-10 flex-grow flex items-center justify-center p-6">
        <div class="glass-card rounded-3xl p-8 md:p-12 max-w-2xl w-full text-center relative overflow-hidden transition-all duration-500">
            
            <!-- Greeting Badge -->
            <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 mb-6 text-sm text-purple-300">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Hello World 第一個網頁</span>
            </div>

            <!-- Main Heading -->
            <h1 id="mainTitle" class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-gradient transition-all duration-300">
                Hello World!
            </h1>

            <p id="subTitle" class="text-slate-300 text-lg md:text-xl font-light mb-8 max-w-lg mx-auto leading-relaxed">
                歡迎來到程式設計的世界！這是專屬於你的第一個互動式極簡網頁。
            </p>

            <!-- Code Snippet Container -->
            <div class="bg-slate-950/60 rounded-2xl p-4 mb-8 text-left border border-slate-800/80 font-mono text-sm relative group">
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800 text-slate-500 text-xs">
                    <div class="flex space-x-1.5">
                        <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
                        <span class="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span>
                    </div>
                    <span>HTML5 / JavaScript</span>
                </div>
                <code id="codeDisplay" class="text-purple-300 block overflow-x-auto">
                    &lt;<span class="text-pink-400">h1</span>&gt;Hello World!&lt;/<span class="text-pink-400">h1</span>&gt;
                </code>
                <button onclick="copyCode()" class="absolute top-3 right-3 text-xs bg-white/10 hover:bg-white/20 px-2 py-1 rounded transition text-slate-300">
                    <i class="fa-regular fa-copy mr-1"></i>複製
                </button>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 justify-center items-center">
                <button onclick="changeLanguage()" class="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 font-semibold text-white glow-effect hover:scale-105 active:scale-95 transition-all duration-200 flex items-center space-x-2">
                    <i class="fa-solid fa-language"></i>
                    <span>切換語言 (Language)</span>
                </button>

                <button onclick="triggerSurprise()" class="px-6 py-3.5 rounded-2xl glass-card font-semibold hover:bg-white/10 active:scale-95 transition-all duration-200 flex items-center space-x-2 border border-white/20">
                    <i class="fa-solid fa-sparkles text-amber-400"></i>
                    <span>驚喜特效</span>
                </button>
            </div>

            <!-- Dynamic Counter Display -->
            <div class="mt-8 pt-6 border-t border-white/10 flex justify-center items-center space-x-2 text-sm text-slate-400">
                <span>點擊互動次數：</span>
                <span id="clickCounter" class="font-bold text-pink-400 text-base">0</span>
            </div>
        </div>
    </main>

    <!-- Custom Toast Message Container -->
    <div id="toast" class="fixed bottom-10 right-10 glass-card px-6 py-4 rounded-2xl flex items-center space-x-3 transition-all duration-300 transform translate-y-20 opacity-0 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-xl"></i>
        <span id="toastText" class="text-sm font-medium">訊息通知</span>
    </div>

    <!-- Footer -->
    <footer class="relative z-10 w-full text-center py-6 text-slate-500 text-sm border-t border-white/5">
        <p>© 2026 Crafted with <i class="fa-solid fa-heart text-pink-500"></i> for Hello World</p>
    </footer>

    <script>
        // State management
        let interactionCount = 0;
        let currentLangIndex = 0;

        const languages = [
            { greeting: "Hello World!", sub: "歡迎來到程式設計的世界！這是專屬於你的第一個互動式極簡網頁。", code: '&lt;<span class="text-pink-400">h1</span>&gt;Hello World!&lt;/<span class="text-pink-400">h1</span>&gt;' },
            { greeting: "你好，世界！", sub: "探索程式的無限可能，從第一個 Hello World 開始！", code: 'console.<span class="text-blue-400">log</span>(<span class="text-emerald-300">"你好，世界！"</span>);' },
            { greeting: "Bonjour le monde!", sub: "Bienvenue dans le monde de la programmation!", code: 'print(<span class="text-emerald-300">"Bonjour le monde!"</span>)' },
            { greeting: "こんにちは世界！", sub: "プログラミングの世界へようこそ！", code: 'System.out.<span class="text-blue-400">println</span>(<span class="text-emerald-300">"こんにちは世界！"</span>);' },
            { greeting: "Hola Mundo!", sub: "¡Bienvenido al mundo de la programación!", code: '&lt;<span class="text-pink-400">p</span>&gt;¡Hola Mundo!&lt;/<span class="text-pink-400">p</span>&gt;' }
        ];

        const themes = [
            "linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a)",
            "linear-gradient(-45deg, #064e3b, #022c22, #0f172a, #065f46)",
            "linear-gradient(-45deg, #4c0519, #831843, #0f172a, #581c87)",
            "linear-gradient(-45deg, #1e293b, #0f172a, #172554, #1e1b4b)"
        ];
        let currentThemeIndex = 0;

        // Increment interaction counter
        function incrementCounter() {
            interactionCount++;
            document.getElementById('clickCounter').textContent = interactionCount;
        }

        // Change Language Function
        function changeLanguage() {
            incrementCounter();
            currentLangIndex = (currentLangIndex + 1) % languages.length;
            const lang = languages[currentLangIndex];

            const title = document.getElementById('mainTitle');
            const sub = document.getElementById('subTitle');
            const code = document.getElementById('codeDisplay');

            // Fade out animation
            title.style.opacity = '0';
            sub.style.opacity = '0';

            setTimeout(() => {
                title.textContent = lang.greeting;
                sub.textContent = lang.sub;
                code.innerHTML = lang.code;

                // Fade in animation
                title.style.opacity = '1';
                sub.style.opacity = '1';
            }, 200);

            showToast("語言已更換！");
        }

        // Theme Toggle Function
        document.getElementById('themeToggle').addEventListener('click', () => {
            incrementCounter();
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.style.background = themes[currentThemeIndex];
            document.body.style.backgroundSize = "400% 400%";
            showToast("主題色調已更換！");
        });

        // Trigger Surprise Effect
        function triggerSurprise() {
            incrementCounter();
            const title = document.getElementById('mainTitle');
            title.classList.add('scale-110', 'rotate-1');
            
            setTimeout(() => {
                title.classList.remove('scale-110', 'rotate-1');
            }, 300);

            showToast("✨ 觸發隱藏動畫！");
        }

        // Copy Code Function
        function copyCode() {
            const rawCode = document.getElementById('codeDisplay').innerText;
            
            // Clipboard fallback
            const tempInput = document.createElement('textarea');
            tempInput.value = rawCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast("程式碼已複製到剪貼簿！");
        }

        // Toast Notification Function
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');

            toastText.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
